# =========================================================
# 공통 설정 (모든 프로필 공통)
# =========================================================
spring:
  application:
    name: behavior-tracker
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# ===== 애플리케이션 커스텀 =====
app:
  jwt:
    issuer: behavior-tracker
    access-token-validity-seconds: 3600        # 1시간
    refresh-token-validity-seconds: 1209600    # 14일
    # secret은 프로필별로 오버라이드. local만 기본값 제공.

  weather:
    # api-key는 프로필별로 오버라이드 (절대 커밋 금지)
    base-url: https://api.openweathermap.org/data/2.5
    units: metric
    lang: kr
    connect-timeout-ms: 2000
    read-timeout-ms: 3000

---
# =========================================================
# local 프로필 — 로컬 개발 (H2)
# =========================================================
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:behaviortracker;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    root: INFO
    com.abc.behaviortracker: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.security: DEBUG

app:
  jwt:
    secret: local-development-secret-key-please-change-me-to-at-least-256-bits-long
  weather:
    api-key: ${OPENWEATHER_API_KEY:}

---
# =========================================================
# dev 프로필 — 개발 서버 (PostgreSQL via Docker)
# =========================================================
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:behaviortracker}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:abcuser}
    password: ${DB_PASSWORD:abcpassword}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Seoul

logging:
  level:
    root: INFO
    com.abc.behaviortracker: DEBUG
    org.hibernate.SQL: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-1234567890-abcdefghij-klmnopqrst-uvwxyz}
  weather:
    api-key: ${OPENWEATHER_API_KEY:}

---
# =========================================================
# prod 프로필 — 운영
# =========================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Seoul

logging:
  level:
    root: WARN
    com.abc.behaviortracker: INFO

app:
  jwt:
    secret: ${JWT_SECRET}
  weather:
    api-key: ${OPENWEATHER_API_KEY}